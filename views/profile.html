<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile · Laptop Inventory Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>try{var t=localStorage.getItem('theme')||'light';if(t==='system')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563EB'/%3E%3Cpath d='M9 10h14v9H9z M6 22h20' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body data-page="profile">
  <main id="page" class="page">
    <div class="page-head"><div><h1>My profile</h1><p>Your account details and password.</p></div></div>
    <div class="stack" style="max-width:860px">
      <section class="card">
        <div class="profile-card">
          <div class="avatar lg" id="pf-avatar"></div>
          <div style="flex:1;min-width:200px"><h2 id="pf-name"></h2><div style="margin-top:8px"><span class="badge role" id="pf-role"></span></div></div>
          <button class="btn" id="edit-profile-btn"><i data-lucide="pencil"></i> Edit profile</button>
        </div>
        <div class="card-body" style="border-top:1px solid var(--border)">
          <dl class="info-list">
            <div><dt>Full name</dt><dd id="pf-fullname"></dd></div>
            <div><dt>Username</dt><dd id="pf-username"></dd></div>
            <div><dt>Email</dt><dd id="pf-email"></dd></div>
            <div><dt>Account created</dt><dd id="pf-created"></dd></div>
          </dl>
        </div>
      </section>

      <section class="card">
        <div class="card-head"><h2>Change password</h2></div>
        <form class="card-body" id="password-form" novalidate>
          <div class="form-grid">
            <div class="field full"><label for="current_password">Current password</label>
              <div class="pw"><input class="input" id="current_password" name="current_password" type="password" autocomplete="current-password"><button type="button" class="toggle-pw" aria-label="Show password"><i data-lucide="eye"></i></button></div><div class="field-error"></div></div>
            <div class="field"><label for="new_password">New password</label>
              <div class="pw"><input class="input" id="new_password" name="new_password" type="password" autocomplete="new-password"><button type="button" class="toggle-pw" aria-label="Show password"><i data-lucide="eye"></i></button></div>
              <div class="field-hint">8+ characters with a letter and a number.</div><div class="field-error"></div></div>
            <div class="field"><label for="confirm_password">Confirm new password</label>
              <div class="pw"><input class="input" id="confirm_password" name="confirm_password" type="password" autocomplete="new-password"><button type="button" class="toggle-pw" aria-label="Show password"><i data-lucide="eye"></i></button></div><div class="field-error"></div></div>
          </div>
          <div class="form-actions"><button type="submit" class="btn btn-primary">Update password</button></div>
        </form>
      </section>
    </div>
  </main>

  <div class="modal-overlay" id="profile-modal" role="dialog" aria-modal="true" aria-labelledby="pm-title" aria-hidden="true">
    <form class="modal sm" id="profile-form" novalidate>
      <div class="modal-head"><h2 id="pm-title">Edit profile</h2><button type="button" class="modal-close" data-close-modal aria-label="Close">&times;</button></div>
      <div class="modal-body">
        <div class="form-grid" style="grid-template-columns:1fr">
          <div class="field"><label for="full_name">Full name</label><input class="input" id="full_name" name="full_name" maxlength="80"><div class="field-error"></div></div>
          <div class="field"><label for="username">Username</label><input class="input" id="username" name="username" maxlength="30"><div class="field-error"></div></div>
          <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" maxlength="120"><div class="field-error"></div></div>
        </div>
      </div>
      <div class="modal-foot"><button type="button" class="btn" data-close-modal>Cancel</button><button type="submit" class="btn btn-primary">Save changes</button></div>
    </form>
  </div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/js/main.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
